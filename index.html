<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="OPIc 5-5 IM2 준비: 주제별 짧은 영어 문장으로 시작하는 최소암기 연습"
    />
    <meta name="theme-color" content="#15924f" />
    <title>OPIc 5-5 IM2 최소암기 스크립트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 이동</a>

    <header class="hero">
      <div class="hero__inner">
        <p class="eyebrow">OPIc 5-5 · IM2</p>
        <h1>최소암기 스크립트</h1>
        <p class="hero__description">
          실제로 같은 문장을 쓰는 답변을 먼저 익히세요. 다른 질문은 각 질문의 기본 답변을 확인합니다.
          159개 답변은 막힐 때 보는 참고 예시입니다.
        </p>
        <div class="hero__stats" aria-label="학습 자료 요약">
          <span><strong>5</strong>개 확인된 공통 답변</span>
          <span><strong id="question-count">159</strong>개 참고 문제</span>
          <span><strong>v37</strong> · 2026-09-28</span>
        </div>
      </div>
    </header>

    <main id="main-content" class="page-shell">
      <section class="study-panel" aria-label="OPIc 학습 자료">
        <p class="study-tip">
          첫 화면의 공통 답변은 표시된 질문에만 그대로 재사용합니다. 아래 주제별 분류는 질문을 찾는 목록이며, 뒷문장이 공통이라는 뜻은 아닙니다.
          <a href="https://github.com/sh0427-han/opic_script/blob/main/STUDY_GUIDE.md">최소암기 학습법 보기</a>
        </p>
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="보기 방식">
            <button
              id="sets-tab"
              class="tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="content"
              data-view="sets"
            >
              공통 답변
            </button>
            <button
              id="core-tab"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="content"
              data-view="core"
            >
              핵심 암기
            </button>
            <button
              id="scripts-tab"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="content"
              data-view="scripts"
            >
              전체 스크립트
            </button>
            <button
              id="questions-tab"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="content"
              data-view="questions"
            >
              문제 연습
            </button>
            <button
              id="survey-tab"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="content"
              data-view="survey"
            >
              시험 전 설문
            </button>
          </div>

          <label class="search-box" for="search-input">
            <span class="sr-only">질문과 스크립트 검색</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"
              />
            </svg>
            <input
              id="search-input"
              type="search"
              placeholder="질문이나 표현 검색"
              autocomplete="off"
            />
          </label>
        </div>

        <nav
          id="topic-filters"
          class="topic-filters"
          aria-label="주제 필터"
        ></nav>

        <div class="content-header">
          <p id="view-description" class="view-description"></p>
          <p id="result-summary" class="result-summary" aria-live="polite"></p>
        </div>

        <div
          id="content"
          class="content"
          role="tabpanel"
          aria-labelledby="sets-tab"
        ></div>

        <noscript>
          <p class="empty-state">
            이 페이지를 보려면 브라우저에서 JavaScript를 활성화해 주세요.
          </p>
        </noscript>
      </section>
    </main>

    <footer>
      <p>OPIc 5-5 IM2 · 질문별 맞춤 1인 설정 통합본 · v37</p>
    </footer>

    <button id="scroll-top" class="scroll-top" type="button" aria-label="맨 위로">
      ↑
    </button>

    <script src="script-data.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
